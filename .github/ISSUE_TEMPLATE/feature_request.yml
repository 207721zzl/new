name: 功能建议
description: 建议新的能力或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请说明谁会在什么情况下使用这项能力。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述完成后的用户行为或接口行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的方案
      description: 如有，请说明当前替代方案和它的不足。
